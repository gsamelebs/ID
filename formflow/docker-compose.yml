services:
  database:
    image: postgres:16-alpine
    container_name: formflow-database
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-formflow}
      POSTGRES_USER: ${DATABASE_USER:-formflow_user}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-CHANGE_ME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-formflow_user} -d ${DATABASE_NAME:-formflow}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - formflow

  backend:
    build:
      context: ./backend
    image: ${BACKEND_IMAGE:-formflow-backend:local}
    container_name: formflow-backend
    restart: unless-stopped
    environment:
      BACKEND_PORT: ${BACKEND_PORT:-3000}
      APP_VERSION: ${APP_VERSION:-dev}
      DATABASE_HOST: database
      DATABASE_PORT: ${DATABASE_PORT:-5432}
      DATABASE_NAME: ${DATABASE_NAME:-formflow}
      DATABASE_USER: ${DATABASE_USER:-formflow_user}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-CHANGE_ME}
    depends_on:
      database:
        condition: service_healthy
    networks:
      - formflow

  frontend:
    build:
      context: ./frontend
    image: ${FRONTEND_IMAGE:-formflow-frontend:local}
    container_name: formflow-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:8080"
    depends_on:
      - backend
    networks:
      - formflow

volumes:
  postgres_data:

networks:
  formflow:
    driver: bridge
